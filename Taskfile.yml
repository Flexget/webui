version: '3'

dotenv: ['.env']

tasks:
  setup:
    desc: Install correct Node.js version via nvm and project dependencies
    cmds:
      - |
        bash -c '
          . "$HOME/.nvm/nvm.sh" || { echo "Error: nvm not found at $HOME/.nvm"; exit 1; }
          nvm install || {
            echo ""
            echo "Error: nvm install failed (network issue or missing mirror?)"
            echo "Fix: ensure nodejs.org is reachable, then re-run task setup."
            echo "Or install Node 20 via your OS and run: task install"
            exit 1
          }
          which yarn || npm install -g yarn
        '
      - task: install

  install:
    desc: Install project dependencies
    cmds:
      - fish -c 'yarn install'
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/.yarn-integrity

  dev:
    desc: Start development server
    cmds:
      - fish -c 'yarn start'

  build:
    desc: Build for production
    cmds:
      - fish -c 'yarn build'

  test:
    desc: Run test suite
    cmds:
      - fish -c 'yarn test'

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - fish -c 'yarn test:watch'

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - fish -c 'yarn test --coverage'

  lint:
    desc: Run ESLint
    cmds:
      - fish -c 'yarn lint'

  lint:fix:
    desc: Fix auto-fixable ESLint errors
    cmds:
      - fish -c 'yarn lint --fix'

  typecheck:
    desc: Type-check without emitting
    cmds:
      - fish -c './node_modules/.bin/tsc --noEmit'

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist/
